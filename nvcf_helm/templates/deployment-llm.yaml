{{- if .Values.llm.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nemotron-voice-agent.fullname" . }}-llm
  labels:
    {{- include "nemotron-voice-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm
spec:
  replicas: 1
  progressDeadlineSeconds: 7200
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nemotron-voice-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: llm
  template:
    metadata:
      labels:
        {{- include "nemotron-voice-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: llm
    spec:
      {{- include "nemotron-voice-agent.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: nim-llm
          image: "{{ include "nemotron-voice-agent.llmImage" . }}"
          imagePullPolicy: {{ .Values.llmImage.pullPolicy }}
          {{- include "nemotron-voice-agent.nimStartCommand" . | nindent 10 }}
          env:
            {{- include "nemotron-voice-agent.ngcApiKeyEnv" . | nindent 12 }}
            - name: NIM_HTTP_API_PORT
              value: "8000"
            - name: NIM_KVCACHE_PERCENT
              value: {{ .Values.llm.nimKvCachePercent | quote }}
            - name: NIM_MAX_MODEL_LEN
              value: {{ .Values.llm.nimMaxModelLen | quote }}
            - name: NIM_PASSTHROUGH_ARGS
              value: >-
                --enable-auto-tool-choice
                --tool-call-parser qwen3_coder
                --reasoning-parser nemotron_v3
                --max-num-seqs {{ .Values.llm.nimMaxNumSeqs }}
            - name: NIM_TAGS_SELECTOR
              value: {{ .Values.llm.nimTagsSelector | quote }}
            - name: NVIDIA_VISIBLE_DEVICES
              value: {{ .Values.llm.gpuDevices | quote }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # startupProbe: allows up to 1800 s for model download + initialisation
          # before liveness/readiness probes kick in (30 s × 60 = 1800 s).
          {{- if .Values.nimReadyImmediate }}
          # STAGING (nimReadyImmediate): report Ready as soon as the container is running so NVCF
          # marks the function ACTIVE without waiting for the ~15-20 min model-load / TRT-engine
          # rebuild (which exceeds NVCF's pod-readiness deadline). NIMs warm ASYNC; liveness is
          # delayed 40 min so it does not kill the container mid-load.
          livenessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            initialDelaySeconds: 2400
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 10
          {{- else }}
          startupProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            periodSeconds: 30
            failureThreshold: 60
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          {{- end }}
          volumeMounts:
            - name: nim-cache
              mountPath: /opt/nim/.cache
            - name: shm
              mountPath: /dev/shm
          {{- with .Values.llm.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: nim-cache
          {{- if .Values.llm.cache.nvcf }}
          # NVCF: model weights are downloaded at startup into node-ephemeral
          # storage. No PVC is created.
          emptyDir:
            sizeLimit: {{ .Values.llm.cache.size }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "nemotron-voice-agent.fullname" . }}-llm-cache
          {{- end }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.llm.shmSize }}
      {{- with .Values.llm.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.llm.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.llm.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
