{{- if .Values.asr.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nemotron-voice-agent.fullname" . }}-asr
  labels:
    {{- include "nemotron-voice-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: asr
spec:
  replicas: 1
  progressDeadlineSeconds: 7200
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nemotron-voice-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: asr
  template:
    metadata:
      labels:
        {{- include "nemotron-voice-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: asr
    spec:
      {{- include "nemotron-voice-agent.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: nim-asr
          image: "{{ include "nemotron-voice-agent.asrImage" . }}"
          imagePullPolicy: {{ .Values.asrImage.pullPolicy }}
          {{- include "nemotron-voice-agent.nimStartCommand" . | nindent 10 }}
          env:
            {{- include "nemotron-voice-agent.ngcApiKeyEnv" . | nindent 12 }}
            - name: NIM_HTTP_API_PORT
              value: "9001"
            - name: NIM_GRPC_API_PORT
              value: "50052"
            - name: NIM_TAGS_SELECTOR
              value: {{ .Values.asr.nimTagsSelector | quote }}
            - name: NVIDIA_VISIBLE_DEVICES
              value: {{ .Values.asr.gpuDevices | quote }}
          ports:
            - name: grpc
              containerPort: 50052
              protocol: TCP
            - name: http
              containerPort: 9001
              protocol: TCP
          # startupProbe: allows up to 2400 s for model download + initialisation
          # (30 s × 80 = 2400 s).
          {{- if .Values.nimReadyImmediate }}
          # STAGING (nimReadyImmediate): report Ready as soon as the container is running so NVCF
          # marks the function ACTIVE without waiting for the ~15-20 min model-load / TRT-engine
          # rebuild (which exceeds NVCF's pod-readiness deadline). NIMs warm ASYNC; liveness is
          # delayed 40 min so it does not kill the container mid-load.
          livenessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            initialDelaySeconds: 2400
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 10
          {{- else }}
          startupProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            periodSeconds: 30
            failureThreshold: 80
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          {{- end }}
          volumeMounts:
            - name: nim-cache
              mountPath: /opt/nim/.cache
            - name: shm
              mountPath: /dev/shm
          {{- with .Values.asr.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: nim-cache
          {{- if .Values.asr.cache.nvcf }}
          # NVCF: model weights are downloaded at startup into node-ephemeral
          # storage. No PVC is created.
          emptyDir:
            sizeLimit: {{ .Values.asr.cache.size }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "nemotron-voice-agent.fullname" . }}-asr-cache
          {{- end }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.asr.shmSize }}
      {{- with .Values.asr.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.asr.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.asr.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
