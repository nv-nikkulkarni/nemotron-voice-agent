apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nemotron-voice-agent.fullname" . }}-config
  labels:
    {{- include "nemotron-voice-agent.labels" . | nindent 4 }}
data:
  # Service catalog for the in-cluster NIM pods this chart deploys, mounted at
  # /app/services.yaml. It lists only the self-hosted `server` entries and has no
  # `nvcf` keys, so the app never falls back to a hosted endpoint
  # (integrate.api.nvidia.com / inference-api.nvidia.com). Endpoints are the fixed
  # Service names of this chart. Lightning's model_id is its served model name.
  services.yaml: |
    server:
      llm:
        nemotron-lightning:
          name: "Nemotron 3.5 Lightning 30B A3B"
          model_id: {{ .Values.llmLightning.servedModelName | quote }}
          base_url: "http://nvidia-llm:8000/v1"
          health_path: "/v1/health/ready"
          extra_params: '{"extra_body":{"repetition_penalty":1.05}}'
          settings: nemotron-nim
        {{- if .Values.llmSuper.enabled }}
        nemotron-super:
          name: "Nemotron 3 Super 120B A12B"
          model_id: "nvidia/nemotron-3-super-120b-a12b"
          base_url: "http://nemotron-3-super:8000/v1"
          health_path: "/v1/health/ready"
          extra_params: '{"extra_body":{"repetition_penalty":1.05}}'
          settings: nemotron-super
        {{- end }}
        {{- if .Values.llmSuperVl.enabled }}
        nemotron-super-vl:
          name: "Nemotron 3.5 Super VL 120B A12B"
          model_id: {{ .Values.llmSuperVl.servedModelName | quote }}
          base_url: "http://nvidia-llm-super-vl:8000/v1"
          health_path: "/v1/health/ready"
          supported_languages: [en, de, es, fr, it, ja, hi, ko, pt, zh]
          settings: nemotron-super-vl
        {{- end }}
        {{- with .Values.vllmModels.gemma4 }}
        {{- if .enabled }}
        gemma-4-31b:
          name: "Gemma 4 31B"
          model_id: {{ .servedModelName | quote }}
          base_url: "http://{{ .serviceName }}:{{ .port }}/v1"
          health_path: "/health"
          supported_languages: [en, de, es, fr, it, ja, hi, ko, pt, zh, ar, vi]
          settings: gemma-4-31b
        {{- end }}
        {{- end }}
        {{- if .Values.omni.enabled }}
        nemotron-omni-nvfp4:
          name: "Nemotron 3 Nano Omni 30B A3B Reasoning"
          model_id: {{ .Values.omni.servedModelName | quote }}
          base_url: "http://nvidia-llm-vllm-omni:{{ .Values.omni.port }}/v1"
          health_path: "/health"
          extra_params: '{"extra_body":{"top_k":1,"chat_template_kwargs":{"enable_thinking":false},"repetition_penalty":1.05}}'
          settings: nemotron-omni-nim
        {{- else if .Values.omniRemote.functionId }}
        # Omni runs as its own NVCF function. No health_path: the NVCF gateway, not the
        # app, gates readiness, and the app's readiness probe sends no credentials.
        nemotron-omni-nvfp4:
          name: "Nemotron 3 Nano Omni 30B A3B Reasoning"
          model_id: {{ .Values.omni.servedModelName | quote }}
          base_url: "https://{{ .Values.omniRemote.functionId }}.invocation.api.nvcf.nvidia.com/v1"
          extra_params: '{"extra_body":{"top_k":1,"chat_template_kwargs":{"enable_thinking":false},"repetition_penalty":1.05}}'
          settings: nemotron-omni-nim
        {{- end }}
      tts:
        magpie-multilingual-tts:
          name: "Magpie TTS Multilingual"
          server: "magpie-multilingual-tts-service:50051"
          voice_id: "Magpie-Multilingual.EN-US.Aria"
          model: "magpie-tts-multilingual"
          settings: magpie-tts
        chatterbox-multilingual-tts:
          name: "Chatterbox TTS Multilingual"
          server: "chatterbox-tts-service:50051"
          voice_id: "Chatterbox-Multilingual.en-US.Male"
          model: "chatterbox-tts-multilingual"
          max_tts_chunk_chars: 240
          synthesis_mode: per_sentence
        magpie-zeroshot-tts:
          name: "Magpie TTS Zeroshot"
          server: "magpie-zeroshot-tts-service:50051"
          voice_id: "Magpie-ZeroShot-Multilingual.Female"
          model: "magpie-tts-zeroshot"
          settings: magpie-tts
          language_code: en-US
      asr:
        nemotron-asr-streaming-english:
          name: "Nemotron ASR Streaming English"
          server: "nemotron-asr-streaming-english:50052"
          model: "cache-aware-parakeet-rnnt-multi-asr-streaming-sortformer"
        {{- if .Values.asrMultilingual.enabled }}
        nemotron-asr-streaming-multilingual:
          name: "Nemotron ASR Streaming Multilingual"
          server: "nemotron-asr-streaming-multilingual:50052"
          model: "cache-aware-parakeet-rnnt-multi-asr-streaming-sortformer"
          language_code: "auto"
        {{- end }}
  # Mounted at /app/examples_registry.yaml inside the app container.
  # Controls which examples and transports the UI exposes.
  examples_registry.yaml: |
    # EXAMPLE_SELECTION env var overrides `selection` at runtime.
    selection: {{ .Values.app.example }}

    # TRANSPORT_SELECTION env var overrides `transports` at runtime.
    transports: {{ if .Values.app.transport }}{{ .Values.app.transport }}{{ else }}all{{ end }}

    # Demo examples. Generic Frontend/Backend offers Lightning, Gemma 4, and Super VL
    # Talkers with a Super VL Thinker; the multilingual flavor adds Hindi and
    # any-language launch variants.
    examples:
      generic-frontend-backend-agent:
        label: Generic Frontend/Backend Assistant
        domain_profile: generic
        thinker_prompt: generic_thinker
        tools:
          - get_weather
          - get_stock_price
          - get_current_time
          - show_architecture
          - web_search
          - calculate_bmi
          - generate_random_number
        agent_prompt_keys:
          - talker
          - thinker
          - generic_thinker
        services:
          llm: [{{ include "nemotron-voice-agent.talkerLlms" . }}]
          thinker-llm: [{{ include "nemotron-voice-agent.thinkerLlm" . }}]
          asr: [nemotron-asr-streaming-english]
          tts: [magpie-multilingual-tts{{ if .Values.chatterboxTts.enabled }}, chatterbox-multilingual-tts{{ end }}{{ if .Values.zeroShotTts.enabled }}, magpie-zeroshot-tts{{ end }}]
        categories:
          thinker-llm: llm
        settings:
          {{- include "nemotron-voice-agent.fbaLlmSettings" . | nindent 10 }}
        defaults:
          prompt: [generic_talker]
        bot: examples.frontend_backend_agent.pipeline:bot

      {{- if and .Values.asrMultilingual.enabled .Values.vllmModels.gemma4.enabled }}
      multilingual-generic-frontend-backend-agent:
        label: Multilingual Frontend/Backend Assistant
        domain_profile: generic
        thinker_prompt: generic_thinker
        capabilities: [session_languages]
        tools:
          - get_weather
          - get_stock_price
          - get_current_time
          - show_architecture
          - web_search
          - calculate_bmi
          - generate_random_number
        agent_prompt_keys:
          - talker
          - thinker
          - generic_thinker
          - fixed_session_language_addon
          - thinker_session_language_addon
          - hindi_talker
          - hindi_thinker
          - multilingual_talker
          - multilingual_thinker
        services:
          # Lightning declares fewer languages; the session language list is the
          # intersection with the selected Talker, so Gemma 4 and Super VL come first.
          llm: [gemma-4-31b{{ if .Values.llmSuperVl.enabled }}, nemotron-super-vl{{ end }}{{ if .Values.llmLightning.enabled }}, nemotron-lightning{{ end }}]
          thinker-llm: [{{ include "nemotron-voice-agent.thinkerLlm" . }}]
          asr: [nemotron-asr-streaming-multilingual]
          tts: [magpie-multilingual-tts{{ if .Values.chatterboxTts.enabled }}, chatterbox-multilingual-tts{{ end }}{{ if .Values.zeroShotTts.enabled }}, magpie-zeroshot-tts{{ end }}]
        categories:
          thinker-llm: llm
        settings:
          {{- include "nemotron-voice-agent.fbaLlmSettings" . | nindent 10 }}
        variants:
          hindi:
            label: Hindi
            description: Speaks and listens in Hindi, with the same tools.
            session_language: hi-IN
            llm: gemma-4-31b
            tts_voice: Leo
            talker_prompt_addon: hindi_talker
            thinker_prompt_addon: hindi_thinker
          multilingual:
            label: Any language
            description: Pick any supported language before you start.
            llm: gemma-4-31b
            talker_prompt_addon: multilingual_talker
            thinker_prompt_addon: multilingual_thinker
        defaults:
          default_session_language: en-US
          prompt: [generic_talker]
        bot: examples.frontend_backend_agent.pipeline:bot
      {{- end }}

      {{- if or .Values.omni.enabled .Values.omniRemote.functionId }}

      omni-assistant-subagents:
        label: Nemotron Omni Assistant Subagents
        services:
          llm: [nemotron-omni-nvfp4]
          tts: [magpie-multilingual-tts{{ if .Values.chatterboxTts.enabled }}, chatterbox-multilingual-tts{{ end }}{{ if .Values.zeroShotTts.enabled }}, magpie-zeroshot-tts{{ end }}]
        capabilities: [attachments, webcam]
        defaults:
          prompt: [omni_subagents_assistant]
        bot: examples.omni_assistant_subagents.pipeline:bot
      {{- end }}
