{{- if .Values.omni.enabled -}}
# Preserve the single-GPU hostname and expose the server catalog hostname.
apiVersion: v1
kind: Service
metadata:
  name: nvidia-llm-vllm-omni
  labels:
    {{- include "nemotron-voice-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: omni
spec:
  type: ClusterIP
  selector:
    {{- include "nemotron-voice-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: omni
  ports:
    - name: http
      port: {{ .Values.omni.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nvidia-llm-omni
  labels:
    {{- include "nemotron-voice-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: omni
spec:
  type: ClusterIP
  selector:
    {{- include "nemotron-voice-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: omni
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
{{- end }}
