{{- if .Values.omni.enabled -}}
# The chart runs vLLM, so expose the single-GPU catalog endpoint and its /health
# contract. The server catalog hostname selects a NIM readiness contract.
apiVersion: v1
kind: Service
metadata:
  name: nvidia-llm-vllm-omni
  labels:
    {{- include "nemotron-voice-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: omni
spec:
  type: ClusterIP
  selector:
    {{- include "nemotron-voice-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: omni
  ports:
    - name: http
      port: {{ .Values.omni.port }}
      targetPort: http
      protocol: TCP
{{- end }}
