{{- if .Values.asrMultilingual.enabled -}}
# Service name is fixed to "nemotron-asr-streaming-multilingual" — matches the
# hostname the app reads from the chart's services.yaml (configmap.yaml).
apiVersion: v1
kind: Service
metadata:
  name: nemotron-asr-streaming-multilingual
  labels:
    {{- include "nemotron-voice-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: asr-multilingual
spec:
  type: ClusterIP
  selector:
    {{- include "nemotron-voice-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: asr-multilingual
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 9001
      targetPort: http
      protocol: TCP
{{- end }}
