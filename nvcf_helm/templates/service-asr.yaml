{{- if .Values.asr.enabled -}}
# Service name is fixed to "nemotron-asr-streaming-english" — matches the
# hostname the app reads from src/examples/*/services.local.yaml.
apiVersion: v1
kind: Service
metadata:
  name: nemotron-asr-streaming-english
  labels:
    {{- include "nemotron-voice-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: asr
spec:
  type: ClusterIP
  selector:
    {{- include "nemotron-voice-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: asr
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 9001
      targetPort: http
      protocol: TCP
{{- end }}
