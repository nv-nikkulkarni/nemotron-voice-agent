{{- if and .Values.imagePullSecret.create .Values.imagePullSecret.ngcApiKey -}}
# Chart-created nvcr.io pull secret. Built from an NGC key with registry access
# to ngcImageRegistryPath, so pods can pull the org's images even when the
# platform-injected pull secret's key can't (403).
{{- $registry := .Values.ngcImageRegistry -}}
{{- $key := .Values.imagePullSecret.ngcApiKey -}}
{{- $auth := printf "$oauthtoken:%s" $key | b64enc -}}
{{- $dockercfg := dict "auths" (dict $registry (dict "username" "$oauthtoken" "password" $key "auth" $auth)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nemotron-voice-agent.fullname" . }}-ngc-pull
  labels:
    {{- include "nemotron-voice-agent.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $dockercfg | toJson | b64enc }}
{{- end }}
