{{- if .Values.tts.enabled -}}
# Preserve the legacy hostname and expose the current server catalog hostname.
apiVersion: v1
kind: Service
metadata:
  name: tts-service
  labels:
    {{- include "nemotron-voice-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: tts
spec:
  type: ClusterIP
  selector:
    {{- include "nemotron-voice-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: tts
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 9000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: magpie-multilingual-tts-service
  labels:
    {{- include "nemotron-voice-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: tts
spec:
  type: ClusterIP
  selector:
    {{- include "nemotron-voice-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: tts
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 9000
      targetPort: http
      protocol: TCP
{{- end }}
