{{- if .Values.chatterboxTts.enabled -}}
# Service name is fixed to "chatterbox-tts-service" — matches the hostname the
# app reads from the chatterbox-tts entry in src/examples/*/services.local.yaml.
apiVersion: v1
kind: Service
metadata:
  name: chatterbox-tts-service
  labels:
    {{- include "nemotron-voice-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: chatterbox-tts
spec:
  type: ClusterIP
  selector:
    {{- include "nemotron-voice-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: chatterbox-tts
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 9000
      targetPort: http
      protocol: TCP
{{- end }}
