{{- if .Values.llmSuperVl.enabled -}}
# Service name fixed to "nvidia-llm-super-vl" — matches the host in the chart's services.yaml.
apiVersion: v1
kind: Service
metadata:
  name: nvidia-llm-super-vl
  labels:
    {{- include "nemotron-voice-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-super-vl
spec:
  type: ClusterIP
  selector:
    {{- include "nemotron-voice-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: llm-super-vl
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
{{- end }}
