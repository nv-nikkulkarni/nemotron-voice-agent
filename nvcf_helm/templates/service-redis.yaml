{{- if .Values.redis.enabled -}}
# Service name is fixed to "redis" — matches REDIS_URL in deployment-app.yaml and the
# hostname docker-compose.yml's redis service uses, so app code needs no environment-
# specific hostname logic.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "nemotron-voice-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    {{- include "nemotron-voice-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
{{- end }}
