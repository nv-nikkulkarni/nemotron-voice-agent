{{- if and .Values.zeroShotTts.enabled (not .Values.zeroShotTts.cache.nvcf) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nemotron-voice-agent.fullname" . }}-magpie-zeroshot-tts-cache
  labels:
    {{- include "nemotron-voice-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: magpie-zeroshot-tts
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.zeroShotTts.cache.storageClass }}
  storageClassName: {{ .Values.zeroShotTts.cache.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.zeroShotTts.cache.size }}
{{- end }}
