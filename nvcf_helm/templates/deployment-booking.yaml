{{- if .Values.booking.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nemotron-voice-agent.fullname" . }}-booking
  labels:
    {{- include "nemotron-voice-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: booking
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nemotron-voice-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: booking
  template:
    metadata:
      labels:
        {{- include "nemotron-voice-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: booking
    spec:
      {{- include "nemotron-voice-agent.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: booking
          image: "{{ include "nemotron-voice-agent.appImage" . }}"
          imagePullPolicy: {{ .Values.appImage.pullPolicy }}
          # Airline booking backend for the frontend-backend-agent example.
          # Same app image, different entrypoint (SQLite-backed HTTP server).
          command: ["uv", "run", "python", "-m", "examples.frontend_backend_agent.airline.database.server"]
          env:
            - name: APP_RUNTIME
              value: "container"
            - name: PYTHONPATH
              value: "/app/src"
            - name: BOOKING_HOST
              value: "0.0.0.0"
            - name: BOOKING_PORT
              value: "8001"
            - name: BOOKING_DB_PATH
              value: {{ .Values.booking.dbPath | quote }}
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: booking-data
              mountPath: /app/data
          {{- with .Values.booking.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: booking-data
          {{- if .Values.booking.cache.nvcf }}
          emptyDir:
            sizeLimit: {{ .Values.booking.cache.size }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "nemotron-voice-agent.fullname" . }}-booking-data
          {{- end }}
      {{- with .Values.booking.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.booking.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.booking.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
