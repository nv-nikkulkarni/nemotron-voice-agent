# Single source of truth for what the UI selector exposes:
#   all            → every registered example (selectable)
#   <example>      → lock to one example (no switching)
#
# The first example listed (YAML insertion order) within the visible set
# becomes the initial default selection.
#
# The ``EXAMPLE_SELECTION`` environment variable overrides this value at
# runtime so the same YAML can drive multiple compose profiles.
selection: all

# Which transport(s) the UI exposes:
#   all        → WebRTC and WebSocket
#   webrtc     → WebRTC only
#   websocket  → WebSocket only
#
# Override at runtime via the ``TRANSPORT_SELECTION`` environment variable.
transports: all

# Each example lists the services it offers per slot from `services.yaml`, in
# UI order. Slots follow the key order; the first entry available in the
# active recipe is the default. A slot reads the catalog category of the same
# name unless `categories` maps it to another one. `settings` overrides
# `settings.yaml` defaults per slot and service key.
examples:
  generic-assistant:
    label: Generic Assistant
    services:
      llm: [nemotron-lightning, nemotron-super]
      asr: [nemotron-asr-streaming-english, parakeet-ctc, parakeet-rnnt]
      tts: [magpie-multilingual-tts, chatterbox-multilingual-tts, magpie-zeroshot-tts]
    capabilities: [streaming_input]
    activity_check:
      first_warning_s: 480
      second_warning_s: 30
      warning_completion_timeout_s: 45
    defaults:
      prompt: [generic_assistant]
    bot: examples.generic.pipeline:bot

  multilingual-assistant:
    label: Multilingual Assistant
    services:
      llm: [nemotron-lightning]
      asr: [nemotron-asr-streaming-multilingual, parakeet-rnnt]
      tts: [magpie-multilingual-tts, chatterbox-multilingual-tts, magpie-zeroshot-tts]
    capabilities: [session_languages]
    agent_prompt_keys:
      - fixed_session_language_addon
    defaults:
      default_session_language: de-DE
      prompt: [multilingual_voice_assistant]
    bot: examples.multilingual.pipeline:bot

  omni-assistant:
    label: Nemotron Omni Assistant
    services:
      llm: [nemotron-omni-nvfp4]
      tts: [magpie-multilingual-tts, chatterbox-multilingual-tts, magpie-zeroshot-tts]
    defaults:
      prompt: [generic_omni_assistant]
    bot: examples.omni_assistant.pipeline:bot

  omni-assistant-subagents:
    label: Nemotron Omni Assistant Subagents
    services:
      llm: [nemotron-omni-nvfp4]
      tts: [magpie-multilingual-tts, chatterbox-multilingual-tts, magpie-zeroshot-tts]
    capabilities: [attachments, webcam]
    defaults:
      prompt: [omni_subagents_assistant]
    bot: examples.omni_assistant_subagents.pipeline:bot

  frontend-backend-agent:
    label: Airline Frontend Backend Agent
    domain_profile: airline
    thinker_prompt: thinker
    agent_prompt_keys:
      - thinker
      - generic_talker
      - generic_thinker
    services:
      llm: [nemotron-lightning]
      thinker-llm: [nemotron-lightning]
      asr: [nemotron-asr-streaming-english, parakeet-ctc]
      tts: [magpie-multilingual-tts, chatterbox-multilingual-tts, magpie-zeroshot-tts]
    categories:
      thinker-llm: llm
    settings:
      thinker-llm:
        nemotron-lightning:
          enable_thinking: true
          reasoning_budget: 1024
    defaults:
      prompt: [talker]
    bot: examples.frontend_backend_agent.pipeline:bot

  generic-frontend-backend-agent:
    label: Generic Frontend Backend Agent
    domain_profile: generic
    thinker_prompt: generic_thinker
    tools:
      - get_weather
      - get_stock_price
      - get_current_time
      - show_architecture
      - web_search
      - calculate_bmi
      - generate_random_number
    agent_prompt_keys:
      - talker
      - thinker
      - generic_thinker
    services:
      llm: [nemotron-lightning, gemma-4-31b, nemotron-super-vl]
      thinker-llm: [nemotron-super-vl, nemotron-lightning]
      asr: [nemotron-asr-streaming-english]
      tts: [magpie-multilingual-tts, chatterbox-multilingual-tts, magpie-zeroshot-tts]
    categories:
      thinker-llm: llm
    settings:
      llm:
        nemotron-lightning:
          enable_thinking: false
          temperature: 0.0
          max_tokens: 512
        gemma-4-31b:
          enable_thinking: false
          temperature: 0.0
          max_tokens: 512
        nemotron-super-vl:
          enable_thinking: false
          temperature: 0.0
          max_tokens: 512
      thinker-llm:
        nemotron-super-vl:
          enable_thinking: true
          reasoning_effort: low
          temperature: 0.0
          max_tokens: 2048
        nemotron-lightning:
          enable_thinking: true
          reasoning_budget: 1024
    defaults:
      prompt: [generic_talker]
    bot: examples.frontend_backend_agent.pipeline:bot

  multilingual-generic-frontend-backend-agent:
    label: Multilingual Frontend/Backend Assistant
    domain_profile: generic
    thinker_prompt: generic_thinker
    capabilities: [session_languages]
    tools:
      - get_weather
      - get_stock_price
      - get_current_time
      - show_architecture
      - web_search
      - calculate_bmi
      - generate_random_number
    agent_prompt_keys:
      - talker
      - thinker
      - generic_thinker
      - fixed_session_language_addon
      - thinker_session_language_addon
      - hindi_talker
      - hindi_thinker
      - multilingual_talker
      - multilingual_thinker
    services:
      llm: [gemma-4-31b, nemotron-super-vl, nemotron-lightning]
      thinker-llm: [nemotron-super-vl, nemotron-lightning]
      asr: [nemotron-asr-streaming-multilingual, parakeet-rnnt]
      tts: [magpie-multilingual-tts, chatterbox-multilingual-tts, magpie-zeroshot-tts]
    categories:
      thinker-llm: llm
    settings:
      llm:
        gemma-4-31b:
          enable_thinking: false
          temperature: 0.0
          max_tokens: 512
        nemotron-super-vl:
          enable_thinking: false
          temperature: 0.0
          max_tokens: 512
        nemotron-lightning:
          enable_thinking: false
          temperature: 0.0
          max_tokens: 512
      thinker-llm:
        nemotron-super-vl:
          enable_thinking: true
          reasoning_effort: low
          temperature: 0.0
          max_tokens: 2048
        nemotron-lightning:
          enable_thinking: true
          reasoning_budget: 1024
    # Launch presets shown on the example card. A variant with a session_language
    # locks the session to it; prompt addons default to the generic language addons.
    variants:
      hindi:
        label: Hindi
        description: Speaks and listens in Hindi, with the same tools.
        session_language: hi-IN
        llm: gemma-4-31b
        tts_voice: Leo
        talker_prompt_addon: hindi_talker
        thinker_prompt_addon: hindi_thinker
      multilingual:
        label: Any language
        description: Pick any supported language before you start.
        llm: gemma-4-31b
        talker_prompt_addon: multilingual_talker
        thinker_prompt_addon: multilingual_thinker
    defaults:
      default_session_language: en-US
      prompt: [generic_talker]
    bot: examples.frontend_backend_agent.pipeline:bot
