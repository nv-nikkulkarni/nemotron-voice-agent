apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: session-data, namespace: voice-agent }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: session-logkeeper, namespace: voice-agent }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: session-logkeeper, namespace: voice-agent }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: session-logkeeper, namespace: voice-agent }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: session-logkeeper }
subjects:
  - kind: ServiceAccount
    name: session-logkeeper
    namespace: voice-agent
---
# PoC: session log/recording collector. Reuses the app image (sh+curl+tar), reads
# app pod logs via the k8s API with its ServiceAccount token, and on each session
# end (Client disconnected) assembles <session_id>.tar.gz = the app log grepped by
# session_id + that session's ASR/TTS WAVs, onto the shared PVC. Then frees raw files.
apiVersion: v1
kind: ConfigMap
metadata: { name: session-logkeeper-script, namespace: voice-agent }
data:
  collect.sh: |
    #!/bin/sh
    set -u
    SAROOT=/var/run/secrets/kubernetes.io/serviceaccount
    NS=$(cat "$SAROOT/namespace")
    API=https://kubernetes.default.svc
    CA="$SAROOT/ca.crt"
    TOKF="$SAROOT/token"
    DATA=/session-data; AUDIO="$DATA/audio"; TARS="$DATA/tarballs"; WORK="$DATA/work"; CAP="$DATA/capture"
    mkdir -p "$AUDIO" "$TARS" "$WORK" "$CAP"
    SEEN="$WORK/.seen"; touch "$SEEN"

    kapi() { curl -sf --cacert "$CA" -H "Authorization: Bearer $(cat "$TOKF")" "$API$1"; }

    app_pod() {
      # k8s API returns pretty JSON; the app pod's metadata.name matches the
      # fullname + two hash segments (replicaset hash + pod suffix).
      kapi "/api/v1/namespaces/$NS/pods?labelSelector=app.kubernetes.io%2Fcomponent%3Dapp" \
        | grep -oE 'voice-agent-nemotron-voice-agent-[0-9a-f]+-[a-z0-9]{5}' | head -1
    }

    process() {   # $1 = session_id
      S="$1"
      grep -qxF "$S" "$SEEN" 2>/dev/null && return 0
      POD=$(app_pod); [ -z "$POD" ] && return 1
      sleep 3   # let the final turn's audio flush to disk

      # The app dumps ASR/TTS audio for EVERY session (global env gate), but we only
      # STORE a session when the user consented. Consent + the transcript arrive from
      # the CLIENT (the capture receiver writes <S>.consent / <S>.transcript.txt on the
      # PVC). Wait briefly for that upload to land at session end.
      i=0
      while [ ! -f "$CAP/$S.consent" ] && [ "$i" -lt 10 ]; do sleep 1; i=$((i+1)); done
      CONSENT=$(cat "$CAP/$S.consent" 2>/dev/null || echo "")

      # Grab the app log (also carries the recorder's file-id we need to free WAVs).
      kapi "/api/v1/namespaces/$NS/pods/$POD/log?container=app&tailLines=200000" \
        | grep "stream_id=$S" > "$WORK/$S.log" 2>/dev/null
      # the audio recorder logs its own file-id: '... Audio recorder enabled ... stream=<R>'
      R=$(grep -oE 'stream=[0-9a-f]{6,}' "$WORK/$S.log" | head -1 | cut -d= -f2)

      if [ "$CONSENT" != "true" ]; then
        # No consent (opted out, or the client never reported) — store NOTHING and
        # discard this session's dumped audio so non-consented audio doesn't linger.
        [ -n "$R" ] && rm -f "$AUDIO"/asr_${R}_*.wav "$AUDIO"/tts_${R}_*.wav
        rm -f "$CAP/$S.consent" "$CAP/$S.transcript.txt" "$WORK/$S.log"
        echo "logkeeper: $S consent=${CONSENT:-none} — NOT stored (audio discarded)"
        echo "$S" >> "$SEEN"; return 0
      fi

      # Consented: assemble session.log + transcript.txt + ASR/TTS WAVs -> tarball.
      [ -s "$WORK/$S.log" ] || { echo "logkeeper: no log lines for $S (skip)"; return 1; }
      STAGE="$WORK/$S"; mkdir -p "$STAGE"
      cp "$WORK/$S.log" "$STAGE/session.log"
      [ -f "$CAP/$S.transcript.txt" ] && cp "$CAP/$S.transcript.txt" "$STAGE/transcript.txt"
      n=0
      if [ -n "$R" ]; then
        for f in "$AUDIO"/asr_${R}_*.wav "$AUDIO"/tts_${R}_*.wav; do
          [ -f "$f" ] && { cp "$f" "$STAGE/"; n=$((n+1)); }
        done
      fi
      tar czf "$TARS/$S.tar.gz" -C "$WORK" "$S" 2>/dev/null
      echo "logkeeper: CAPTURED $S -> $TARS/$S.tar.gz  (session.log + transcript + $n wavs, audio-id=${R:-none})"
      rm -rf "$STAGE" "$WORK/$S.log"
      [ -n "$R" ] && rm -f "$AUDIO"/asr_${R}_*.wav "$AUDIO"/tts_${R}_*.wav
      rm -f "$CAP/$S.consent" "$CAP/$S.transcript.txt"
      echo "$S" >> "$SEEN"
    }

    echo "logkeeper: watching app log for session end (Client disconnected) ..."
    while true; do
      POD=$(app_pod)
      [ -z "$POD" ] && { echo "logkeeper: app pod not found; retry in 10s"; sleep 10; continue; }
      echo "logkeeper: tailing $POD"
      curl -sN --cacert "$CA" -H "Authorization: Bearer $(cat "$TOKF")" \
        "$API/api/v1/namespaces/$NS/pods/$POD/log?container=app&follow=true&sinceSeconds=10" \
      | while IFS= read -r line; do
          case "$line" in
            *"Client disconnected"*)
              S=$(printf '%s' "$line" | grep -oE 'stream_id=[0-9a-f]+' | head -1 | cut -d= -f2)
              [ -n "$S" ] && [ "$S" != "-" ] && process "$S"
              ;;
          esac
        done
      echo "logkeeper: log stream ended (pod rollover?); reconnecting"
      sleep 3
    done
  upload.sh: |
    #!/bin/sh
    # Ship each finished <session_id>.tar.gz to NGC as a version of the
    # session-captures resource, then FREE it locally. Idempotent: if the version
    # already exists in NGC, just free the local copy. The ngc CLI is staged once
    # into the PVC at /session-data/tools/ngc-cli (see README).
    set -u
    NGC=/session-data/tools/ngc-cli/ngc
    ORG=0491162300748285
    RES="$ORG/session-captures"
    TARS=/session-data/tarballs
    export NGC_CLI_API_KEY NGC_CLI_ORG="$ORG" NGC_CLI_FORMAT_TYPE=ascii
    INTERVAL="${UPLOAD_INTERVAL:-60}"
    echo "uploader: shipping tarballs to NGC resource $RES every ${INTERVAL}s"
    while true; do
      if [ -x "$NGC" ]; then
        for t in "$TARS"/*.tar.gz; do
          [ -f "$t" ] || continue
          S=$(basename "$t" .tar.gz)
          if "$NGC" registry resource info "$RES:$S" >/dev/null 2>&1; then
            rm -f "$t"; echo "uploader: $S already in NGC — freed local copy"; continue
          fi
          if "$NGC" registry resource upload-version "$RES:$S" --source "$t" >/tmp/up.log 2>&1; then
            rm -f "$t"; echo "uploader: uploaded + freed $S -> $RES:$S"
          else
            echo "uploader: upload failed for $S (retry next cycle): $(grep -iE 'error' /tmp/up.log | head -1)"
          fi
        done
      else
        echo "uploader: ngc CLI not staged at $NGC yet — skipping"
      fi
      sleep "$INTERVAL"
    done
  receiver.py: |
    # Tiny capture receiver. The UI POSTs {session_id, consent, transcript} to
    # same-origin /capture/session at session end (proxied here by the UI's nginx).
    # We persist a per-session consent marker (+ transcript when consented) onto the
    # shared PVC; collect.sh reads these to decide store-or-discard. Pure stdlib.
    import json, os, re
    from http.server import BaseHTTPRequestHandler, HTTPServer

    CAP = "/session-data/capture"
    os.makedirs(CAP, exist_ok=True)
    _NONHEX = re.compile(r"[^0-9a-fA-F]")

    class H(BaseHTTPRequestHandler):
        def do_POST(self):
            try:
                n = int(self.headers.get("content-length", 0) or 0)
                body = json.loads(self.rfile.read(n) or b"{}")
                sid = _NONHEX.sub("", str(body.get("session_id", "")))[:32]
                if not sid:
                    raise ValueError("no session_id")
                consent = bool(body.get("consent"))
                with open(os.path.join(CAP, sid + ".consent"), "w") as f:
                    f.write("true" if consent else "false")
                tr = body.get("transcript")
                if consent and isinstance(tr, str) and tr.strip():
                    with open(os.path.join(CAP, sid + ".transcript.txt"), "w") as f:
                        f.write(tr[:200000])
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(b'{"ok":true}')
                print(f"capture-receiver: {sid} consent={consent} "
                      f"transcript={'y' if (consent and tr) else 'n'}", flush=True)
            except Exception as e:  # noqa: BLE001
                self.send_response(400)
                self.end_headers()
                try:
                    self.wfile.write(json.dumps({"error": str(e)}).encode())
                except Exception:  # noqa: BLE001
                    pass

        def log_message(self, *a):  # keep the log quiet
            return

    print("capture-receiver: listening on :8080 -> " + CAP, flush=True)
    HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: session-capture-receiver
  namespace: voice-agent
  labels: { app.kubernetes.io/component: session-logkeeper }
spec:
  selector: { app.kubernetes.io/component: session-logkeeper }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-logkeeper
  namespace: voice-agent
  labels: { app.kubernetes.io/component: session-logkeeper }
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO PVC: avoid two pods mounting during rollout
  selector:
    matchLabels: { app.kubernetes.io/component: session-logkeeper }
  template:
    metadata:
      labels: { app.kubernetes.io/component: session-logkeeper }
    spec:
      serviceAccountName: session-logkeeper
      imagePullSecrets:
        - name: ngc-secret
      containers:
        - name: logkeeper
          image: nvcr.io/nim/nvidia/nemotron-voice-agent:demo7
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/collect.sh"]
          volumeMounts:
            - { name: session-data, mountPath: /session-data }
            - { name: script, mountPath: /scripts }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
        # Sidecar: ship finished tarballs to NGC + free them from the PVC.
        - name: uploader
          image: nvcr.io/nim/nvidia/nemotron-voice-agent:demo7
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/upload.sh"]
          env:
            - name: UPLOAD_INTERVAL
              value: "60"
            - name: NGC_CLI_API_KEY
              valueFrom:
                secretKeyRef: { name: ngc-api, key: NGC_API_KEY }
          volumeMounts:
            - { name: session-data, mountPath: /session-data }
            - { name: script, mountPath: /scripts }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 500m, memory: 512Mi }
        # Sidecar: capture receiver — persists the client's consent + transcript.
        - name: receiver
          image: nvcr.io/nim/nvidia/nemotron-voice-agent:demo7
          imagePullPolicy: IfNotPresent
          command: ["/app/.venv/bin/python", "/scripts/receiver.py"]
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: session-data, mountPath: /session-data }
            - { name: script, mountPath: /scripts }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      volumes:
        - name: session-data
          persistentVolumeClaim: { claimName: session-data }
        - name: script
          configMap: { name: session-logkeeper-script }
