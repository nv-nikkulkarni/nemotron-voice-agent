# Values file for the PREVIEW (pre-prod / "staging") app — a separate Astra deployment
# from the live nemotron-voice-agent-deploy. Fusion forbids env keywords (stg/staging/…)
# in repo names, so this lane is named "preview". Fusion appends "-deploy" to the repo
# name, so the repo / app / Vault path are all "nemotron-voice-agent-preview-deploy".
# Same DL / cluster / image repo as prod; only the per-app-unique identity fields differ.
# The preview UI proxies to the STAGING NVCF function
# (d67e6989-0cb4-4f91-89d3-b86992e84a1a) — chosen entirely by the NVCF_HOST /
# NVCF_FUNCTION_ID / NVIDIA_API_KEY values in the preview Vault secret, not baked in.

# All values must be nested under fusionv12 since it's a dependency
fusionv12:
  environment: stg
  appname: nemotron-voice-agent-preview-deploy
  project:
    name: nemotron-voice-agent-preview
    deploymentEnv: stg
    dl: nemotron-voice-agent-astra
    nspect_id: ''
    primary_owner: nikkulkarni@nvidia.com
    secondary_owner: ''
  appDefaults:
    replicaCount: 1
    autoscaling:
      enabled: false
    podAnnotations: {}
    imagePullSecrets:
    - name: astra-jfrog-docker-pullsecret
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    healthCheck:
      enabled: true
      path: /health
  datadog:
    enabled: false
    defaultLanguage: python
    defaultVersion: v3.10.2
  apps:
    backend:
      enabled: true
      replicaCount: 1
      imagePullSecrets:
      - name: astra-jfrog-docker-pullsecret
      image:
        repository: artifactory.nvidia.com/it-astra-docker-local/nemotron-voice-agent/nemotron-voice-agent-ui
        tag: "ddc90e1"
      port: 7860
      env:
        LOG_LEVEL: INFO
        APP_NAME: nemotron-voice-agent-preview
        ENVIRONMENT: stg
      ingress:
        enabled: true
        hostname: nemotron-voice-agent-preview-deploy-backend.stg.astra.nvidia.com
  pvc:
    storageClassName:
  externalSecrets:
    enabled: true
    createSecretStore: true
    secretStoreRef:
      name: nemotron-voice-agent-preview-deploy-secret-store
      kind: SecretStore
    vault:
      server: https://prod.internal.vault.nvidia.com
      namespace: it-fusion
      path: KVv2
      version: v2
      auth:
        jwt:
          path: jwt/astrastg01-ocp-pdx04/
          role: fusion-astra-nemotron-voice-agent-astra-nemotron-voice-agent-preview-deploy-stg
          serviceAccountName: vault-service-account
          audiences:
          - https://kubernetes.default.svc
          expirationSeconds: 600
  sharedSecrets:
    enabled: true
    autoMount: true
    refreshInterval: 60m
    dataFrom:
    - extract:
        key: fusion/astra/nemotron-voice-agent-astra/nemotron-voice-agent-preview-deploy/stg
