<title id="title">Nemotron Voice Agent · Omni Assistant Subagents</title>
<desc id="desc">Microphone and browser transport feed Transport worker. Local VAD and Smart Turn detect user turns. Nano Omni Speaker coordinates Thinker and media workers, then the selected NVIDIA TTS engine speaks. Redis shares coordination and SeaweedFS stores consented captures uploaded to NGC.</desc>
