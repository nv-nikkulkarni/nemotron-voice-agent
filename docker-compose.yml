name: nemotron-voice-agent

# Compose deployments are recipe-based. Every profile is a complete,
# self-contained deployment recipe so users never have to AND two
# profiles together.
#
#   <example>                  cloud-only models
#   <example>/<hardware>       on-prem models with local sidecars
#
# Examples:
#   generic-assistant            Cascaded ASR + LLM + TTS Pipeline (Generic Assistant)
#   multilingual-assistant       Cascaded Multilingual ASR + LLM + TTS Pipeline (Multilingual Assistant)
#   omni-assistant               Cascaded Omni LLM + TTS Pipeline (Omni Assistant)
#   omni-assistant-subagents     Cascaded Omni LLM + TTS Pipeline (Omni Assistant Subagents)
#   frontend-backend-agent               Cascaded Frontend/Backend Agent Pipeline (Airline Assistant)
#
# Hardware targets:
#   server                    NIM ASR + LLM + TTS. Recommended for scaling
#                             on workstation / server GPUs.
#   single-gpu                One GPU (workstation, DGX Spark, or Jetson Thor)
#                             running the NeMo-Speech.cpp speech stack alongside vLLM
#
# Cloud-only recipes:
#   docker compose --profile generic-assistant up
#   docker compose --profile multilingual-assistant up
#   docker compose --profile omni-assistant up
#   docker compose --profile omni-assistant-subagents up
#   docker compose --profile frontend-backend-agent up
#
# On-prem recipes:
#   docker compose --profile generic-assistant/server up
#   docker compose --profile generic-assistant/server-perf up
#   docker compose --profile generic-assistant/single-gpu up
#   docker compose --profile multilingual-assistant/server up
#   docker compose --profile multilingual-assistant/single-gpu up
#   docker compose --profile omni-assistant/server up
#   docker compose --profile omni-assistant/single-gpu up
#   docker compose --profile omni-assistant-subagents/server up
#   docker compose --profile omni-assistant-subagents/single-gpu up
#   docker compose --profile frontend-backend-agent/server up
#   docker compose --profile frontend-backend-agent/single-gpu up
#
# Observability profiles compose orthogonally with any recipe:
#   docker compose --profile <recipe> --profile tracing up   # Phoenix OTel
#   docker compose --profile <recipe> --profile turn up      # coturn TURN

include:
  - path: docker/docker-compose.nemotron35-lightning-nim.yaml
  - path: docker/docker-compose.nemotron35-lightning.yaml
  - path: docker/docker-compose.nemotron3-super.yaml
  - path: docker/docker-compose.nemotron3-omni-nim.yaml
  - path: docker/docker-compose.nemotron-asr.yaml
  - path: docker/docker-compose.parakeet-asr.yaml
  - path: docker/docker-compose.magpie-tts.yaml
  - path: docker/docker-compose.chatterbox-tts.yaml
  - path: docker/docker-compose.magpie-zeroshot-tts.yaml
  - path: docker/docker-compose.nemotron3-omni.yaml
  - path: docker/docker-compose.nemo-speech-cpp.yaml
  - path: docker/docker-compose.coturn.yaml
  - path: docker/docker-compose.phoenix.yaml
  - path: src/examples/frontend_backend_agent/airline/database/docker-compose.yml

x-app: &app-base
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: nemotron-voice-agent:latest
  command: ["uv", "run", "python", "src/server.py", "--host", "0.0.0.0"]
  ports:
    - "${PIPELINE_APP_PORT:-7860}:7860"
  env_file:
    - .env
  volumes:
    - ./src:/app/src:ro
    - ./examples_registry.yaml:/app/examples_registry.yaml:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test: ["CMD-SHELL", "curl -fk $$(test \"$$(printf %s \"$${PIPELINE_TLS:-true}\" | tr '[:upper:]' '[:lower:]')\" = true && echo https || echo http)://localhost:7860/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

x-app-env: &app-env
  APP_RUNTIME: container
  TRANSPORT_SELECTION: ${TRANSPORT_SELECTION:-}
  PIPELINE_TLS: ${PIPELINE_TLS:-true}
  # Redis session bus (src/session_bus/): shared webcam/attachment/config state across
  # replicas. Empty/unset -> in-memory, single-worker mode (unchanged default behavior).
  # Set REDIS_URL="" explicitly to opt out even though the `redis` service below is running.
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  SESSION_BUS_SOCKET_TIMEOUT_SECS: ${SESSION_BUS_SOCKET_TIMEOUT_SECS:-15}
  SESSION_BUS_BLOCK_MS: ${SESSION_BUS_BLOCK_MS:-5000}
  SESSION_BUS_TTL: ${SESSION_BUS_TTL:-3600}
  # session_store (src/session_store/): shared object storage for session-capture
  # log/audio/transcript artifacts across replicas. Defaults to "local" (per-pod
  # files, today's behavior, no new infrastructure) -- matching every other
  # profile's default. To exercise the real S3 path, opt in explicitly with
  # BOTH `--profile capture` (starts the seaweedfs service below) AND
  # `SESSION_STORE_BACKEND=s3` (e.g. `SESSION_STORE_BACKEND=s3 docker compose
  # --profile <example> --profile capture up`) -- a single flag flipping every
  # profile to a network store by default previously caused exactly this: a
  # plain `docker compose --profile generic-assistant up` silently started
  # depending on a second container nothing in that profile asked for.
  SESSION_STORE_BACKEND: ${SESSION_STORE_BACKEND:-local}
  SESSION_STORE_ENDPOINT: ${SESSION_STORE_ENDPOINT:-http://seaweedfs:8333}
  SESSION_STORE_BUCKET: ${SESSION_STORE_BUCKET:-nva-session-capture}
  SESSION_STORE_ACCESS_KEY: ${SESSION_STORE_ACCESS_KEY:-seaweedfs}
  SESSION_STORE_SECRET_KEY: ${SESSION_STORE_SECRET_KEY:-seaweedfs}

services:
  # Redis session bus (src/session_bus/). No `profiles:` -> starts alongside every
  # example profile, so the app's REDIS_URL default (redis://redis:6379/0, above)
  # always resolves under `docker compose --profile <example> up`. In-memory only
  # (no persistence, no PVC) -- sessions are ephemeral, so nothing to durably store.
  redis:
    image: redis:7.2.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # S3-compatible object store backing session_store (src/session_store/), OPT-IN
  # via `--profile capture` (see SESSION_STORE_BACKEND above -- also needs
  # SESSION_STORE_BACKEND=s3 set to actually be used). Single-binary standalone
  # mode (master+volume+filer+s3 in one process) -- fine for local/dev; NVCF/Astra
  # point session_store at a real SeaweedFS/MinIO/S3 deployment instead (see
  # docs/current-deployed-pipeline-architecture.md section 13). No auth enforced by default, hence
  # the placeholder access/secret keys above -- boto3 requires non-empty values to
  # sign requests even though this server doesn't validate them. No host port
  # published: only other containers on this compose network need to reach it
  # (via the `seaweedfs` service DNS name), so there's no reason to expose an
  # unauthenticated S3 endpoint on the host by default.
  seaweedfs:
    image: chrislusf/seaweedfs:4.41
    profiles:
      - capture
    command: ["server", "-s3", "-s3.port=8333", "-dir=/data"]
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  generic-assistant:
    <<: *app-base
    profiles:
      - generic-assistant
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-generic-assistant}

  generic-assistant-server:
    <<: *app-base
    profiles:
      - generic-assistant/server
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-generic-assistant}

  generic-assistant-single-gpu:
    <<: *app-base
    profiles:
      - generic-assistant/single-gpu
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-generic-assistant}

  generic-assistant-server-perf:
    <<: *app-base
    profiles:
      - generic-assistant/server-perf
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: generic-assistant
      UVICORN_WORKERS: "200"
      PROMPT_FILE_PATH: ${PROMPT_FILE_PATH:-}
      PROMPT_SELECTOR: ${PROMPT_SELECTOR:-}
      USE_SILERO_VAD_TURN_DETECTION: "true"
      SILERO_VAD_STOP_SECS: "0.5"
      AUDIO_OUT_10MS_CHUNKS: "40"
      ENABLE_WELCOME_MESSAGE: "false"

  multilingual-assistant:
    <<: *app-base
    profiles:
      - multilingual-assistant
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-multilingual-assistant}

  multilingual-assistant-server:
    <<: *app-base
    profiles:
      - multilingual-assistant/server
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-multilingual-assistant}

  multilingual-assistant-single-gpu:
    <<: *app-base
    profiles:
      - multilingual-assistant/single-gpu
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-multilingual-assistant}

  omni-assistant:
    <<: *app-base
    profiles:
      - omni-assistant
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant}

  omni-assistant-server:
    <<: *app-base
    profiles:
      - omni-assistant/server
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant}

  omni-assistant-single-gpu:
    <<: *app-base
    profiles:
      - omni-assistant/single-gpu
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant}

  omni-assistant-subagents:
    <<: *app-base
    profiles:
      - omni-assistant-subagents
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant-subagents}

  omni-assistant-subagents-server:
    <<: *app-base
    profiles:
      - omni-assistant-subagents/server
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant-subagents}

  omni-assistant-subagents-single-gpu:
    <<: *app-base
    profiles:
      - omni-assistant-subagents/single-gpu
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant-subagents}

  frontend-backend-agent:
    <<: *app-base
    profiles:
      - frontend-backend-agent
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-frontend-backend-agent}

  frontend-backend-agent-server:
    <<: *app-base
    profiles:
      - frontend-backend-agent/server
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-frontend-backend-agent}

  frontend-backend-agent-single-gpu:
    <<: *app-base
    profiles:
      - frontend-backend-agent/single-gpu
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-frontend-backend-agent}

volumes:
  seaweedfs-data:
